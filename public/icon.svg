<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#261b3b"/>
      <stop offset="60%" stop-color="#110d1c"/>
      <stop offset="100%" stop-color="#07050a"/>
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#7e22ce"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="100" fill="url(#bgGrad)"/>
  <circle cx="256" cy="256" r="220" fill="none" stroke="url(#goldGrad)" stroke-width="6" opacity="0.3"/>
  <circle cx="256" cy="256" r="190" fill="none" stroke="url(#purpleGrad)" stroke-width="3" stroke-dasharray="8 8" opacity="0.4"/>
  <!-- Cat Ears -->
  <polygon points="170,190 130,90 230,150" fill="url(#purpleGrad)"/>
  <polygon points="342,190 382,90 282,150" fill="url(#purpleGrad)"/>
  <polygon points="175,175 145,110 215,150" fill="#f43f5e" opacity="0.6"/>
  <polygon points="337,175 367,110 297,150" fill="#f43f5e" opacity="0.6"/>
  <!-- Cat Head -->
  <ellipse cx="256" cy="260" rx="140" ry="120" fill="#181324" stroke="url(#goldGrad)" stroke-width="5"/>
  <!-- Masquerade Mask -->
  <path d="M150,230 Q256,260 362,230 Q390,280 340,300 Q256,280 172,300 Q122,280 150,230 Z" fill="#2e1065" stroke="url(#goldGrad)" stroke-width="4"/>
  <!-- Mystical Glowing Eyes -->
  <ellipse cx="205" cy="250" rx="28" ry="16" fill="#fef08a" transform="rotate(-6 205 250)"/>
  <ellipse cx="307" cy="250" rx="28" ry="16" fill="#fef08a" transform="rotate(6 307 250)"/>
  <ellipse cx="205" cy="250" rx="10" ry="14" fill="#050505"/>
  <ellipse cx="307" cy="250" rx="10" ry="14" fill="#050505"/>
  <circle cx="202" cy="245" r="4" fill="#ffffff"/>
  <circle cx="304" cy="245" r="4" fill="#ffffff"/>
  <!-- Cat Nose & Whisker details -->
  <polygon points="256,285 244,272 268,272" fill="#f43f5e"/>
  <path d="M256,285 Q240,310 215,305 M256,285 Q272,310 297,305" fill="none" stroke="#fcd34d" stroke-width="3" stroke-linecap="round"/>
  <!-- Crown on Top -->
  <path d="M220,140 L235,110 L256,130 L277,110 L292,140 Z" fill="url(#goldGrad)" stroke="#fef08a" stroke-width="2"/>
  <circle cx="235" cy="110" r="4" fill="#ef4444"/>
  <circle cx="256" cy="106" r="5" fill="#3b82f6"/>
  <circle cx="277" cy="110" r="4" fill="#10b981"/>
</svg>
